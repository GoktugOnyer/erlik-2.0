name: tests

on:
  push:
  pull_request:

# A second push to the same branch cancels the first: the older run's verdict
# is about code nobody is looking at any more.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Every version here has actually been run green before being added —
        # pinning a version nobody has executed is the same defect this project
        # keeps finding: a confident green from a path that was never exercised.
        #
        # 3.10 is the floor README.md and setup.sh promise, and it was the gap
        # that mattered: two f-strings using PEP 701 syntax (3.12+ only) made
        # orchestrator/main.py raise SyntaxError at import on 3.10 and 3.11, so
        # the whole application failed to start on a supported interpreter —
        # and a 3.12/3.14 matrix could never see it. Verified on 3.10.20 before
        # adding: 1690 passed, 31 skipped.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # The runner has NO Docker container and NO data/pentest.db — data/ is
      # gitignored because it holds real client findings. Every test that needs
      # either must SKIP with a reason, not fail.
      #
      # That is not free: on a bare clone this suite reported 7 failures and 9
      # errors, because several guards asked whether the database FILE existed
      # rather than whether it had a schema, and something in the suite creates
      # an empty one. See tests/corpus.py.
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml

      # A run where everything skipped is green and worthless. This is the
      # check that CI is actually testing something — the same "confident
      # output from a path that did nothing" the product guards against.
      - name: Assert the suite actually ran
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse("junit.xml").getroot()
          suite = r if r.tag == "testsuite" else r.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"{ran} ran, {skipped} skipped, {total} collected")
          if ran < 1200:
              sys.exit(f"only {ran} tests ran — the suite is not exercising the codebase")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml

  # THE CASES, AGAINST AN APPLICATION NOBODY HERE WROTE.
  #
  # `tests/targets/` proves a case fires on a planted flaw and stays silent on
  # a matched control, and it found every case defect on 2026-09-05. But those
  # targets and those cases have the same author, so a shared misunderstanding
  # of what a real application returns is invisible to that whole harness.
  # Juice Shop is the application the `juiceshop` profile already aims at, and
  # the one every reported campaign result was produced against.
  #
  # This job does NOT assert that Juice Shop is vulnerable — that is Juice
  # Shop's business and it changes between releases. It asserts that what erlik
  # REPORTS about it does not change without someone saying so, in both
  # directions: a finding that disappeared is a case that silently stopped
  # working, and one that appeared is either new coverage or a false positive.
  cases-vs-juiceshop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      juiceshop:
        # PINNED, not `latest`. On `latest` this job would go red whenever
        # Juice Shop shipped a release, for reasons that have nothing to do
        # with this repository — and the baseline it compares against is a
        # statement about one specific application build.
        image: bkimminich/juice-shop:v20.2.0
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Service containers have no healthcheck here, so the job would otherwise
      # race the application's startup and record "no findings" for a target
      # that was not listening yet — a clean bill of health from a run that
      # never reached anything.
      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Juice Shop never answered on :3000 — this run measured nothing"
          exit 1

      # The cases run natively here: there is no Kali container on the runner,
      # and without ERLIK_NATIVE every step is refused, which reads as a case
      # that found nothing. The script sets it for its own process.
      #
      # sqlmap, dalfox, testssl, wafw00f and whatweb are NOT installed, and the
      # four cases naming them are recorded as `unrunnable` with the missing
      # tool named rather than folded into "no findings".
      - name: Cases vs Juice Shop
        run: |
          python scripts/case_baseline.py \
            --base http://127.0.0.1:3000 \
            --profile juiceshop \
            --baseline tests/baselines/juiceshop.json \
            --out measured-juiceshop.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-juiceshop
          path: measured-juiceshop.json
