name: tests

on:
  push:
  pull_request:
  # E-005: "dedicated actual-service jobs run on release or manual dispatch with
  # explicit opt-in variables". Both triggers exist for the jobs below; the
  # opt-in is a repository variable, so a dispatch cannot start them by accident.
  workflow_dispatch:
  release:
    types: [published]

# A second push to the same branch cancels the first: the older run's verdict
# is about code nobody is looking at any more.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- unit
  # Network-free, no Docker, every supported interpreter. Runs on everything.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Every version here has actually been run green before being added —
        # pinning a version nobody has executed is the same defect this project
        # keeps finding: a confident green from a path that was never exercised.
        #
        # 3.10 is the floor README.md and setup.sh promise, and it was the gap
        # that mattered: two f-strings using PEP 701 syntax (3.12+ only) made
        # orchestrator/main.py raise SyntaxError at import on 3.10 and 3.11, so
        # the whole application failed to start on a supported interpreter —
        # and a 3.12/3.14 matrix could never see it. Verified on 3.10.20 before
        # adding: 1690 passed, 31 skipped.
        # 3.11 IS THE FLOOR, and it is a fact about the code rather than a
        # preference: the assessment lane is built on `asyncio.timeout` and
        # `Task.cancelling()`, both of which landed in 3.11. On 3.10 that is 28
        # failures in seven files -- AttributeError, not a subtle behaviour
        # difference -- and it has been red here since the lane arrived while
        # README claimed 3.10+.
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements-dev, not a bare `pytest`: pytest.ini sets
          # `asyncio_mode = auto`, so the suite does not collect without
          # pytest-asyncio. Installing pytest alone turned every async test
          # into a collection error.
          pip install -r requirements-dev.txt

      # The runner has NO Docker container and NO data/pentest.db — data/ is
      # gitignored because it holds real client findings. Every test that needs
      # either must SKIP with a reason, not fail.
      #
      # That is not free: on a bare clone this suite reported 7 failures and 9
      # errors, because several guards asked whether the database FILE existed
      # rather than whether it had a schema, and something in the suite creates
      # an empty one. See tests/corpus.py.
      - name: Test
        run: python -m pytest tests/ -q --junitxml=junit.xml

      # A run where everything skipped is green and worthless. This is the
      # check that CI is actually testing something — the same "confident
      # output from a path that did nothing" the product guards against.
      - name: Assert the suite actually ran
        if: always()
        run: python scripts/ci_assert_suite_ran.py junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          if-no-files-found: error
          path: junit.xml

  # -------------------------------------------------------------- local Docker
  # E-005: "Unit and local Docker jobs cover lifecycle, inventory, benchmark and
  # parser tests". These 35 tests SKIP without ERLIK_DOCKER_TESTS=1, so until
  # this job existed CI had never executed one of them — the lane's entire
  # execution boundary was covered only on a developer's machine.
  #
  # Not on every push: the worker image builds three Go tools and Chromium.
  # §11 of docs/future-plan.md says "isolated scanner tests on relevant pull
  # requests", which is what this is.
  docker:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The assessment lane runs every job in a container off an internal
      # network, so the images have to exist before any of it can be exercised.
      - name: Build the lane images
        run: docker compose -f docker-compose.integrations.yml --profile integrations build

      - name: Pull the pinned scanner image
        run: docker pull ghcr.io/zaproxy/zaproxy:2.16.1

      - name: Record what was pinned
        run: python scripts/release_manifest.py --out build-manifest.json

      # -m docker selects exactly the suites that need a container. The
      # actual-service tests inside them stay skipped: they need their own
      # opt-in variables, which the job below supplies.
      #
      # TWO reports, not one, and they are different measurements: the coverage
      # report is the baseline-vs-integrated benchmark, and the discovery
      # comparison is katana against the original browser crawler on a fixed
      # fixture. Setting only the first captured half the release evidence.
      - name: Local Docker suites
        env:
          ERLIK_DOCKER_TESTS: "1"
          ERLIK_COVERAGE_REPORT: coverage-report.json
          ERLIK_BENCHMARK_OUTPUT: discovery-comparison.json
        run: python -m pytest -m docker -q --junitxml=junit-docker.xml

      # THE SAME GUARD, ON THIS REPORT TOO. It was wired to junit.xml only, and
      # README.md says it protects against a run that "silently skipped itself"
      # one sentence after describing this job — so three of the four reports CI
      # writes were unguarded, and a docker job that built the images and then
      # skipped every test was green and proved nothing. Floor from the measured
      # composition: `-m docker` selects 35 and exactly 3 always skip here
      # (the live-DefectDojo case and the two real-Interactsh cases need opt-ins
      # that only the actual-services job supplies), so 32 run; 30 leaves room
      # for one more always-skipping case without crying wolf, because a guard
      # that fires on a healthy run gets removed.
      - name: Assert the Docker suites actually ran
        if: always()
        run: python scripts/ci_assert_suite_ran.py junit-docker.xml --floor 30 --ratio 0.85

      # "produce release evidence" — these reports are what a release is judged
      # on, and they are worthless if nobody can find the run that produced
      # them. build-manifest.json is what makes the other three legible later:
      # it names the image digests and in-image tool versions they were measured
      # against.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          # A MISSING REPORT IS NOT AN EMPTY UPLOAD. The default is a warning, so
          # a step that never produced its evidence uploaded nothing and the job
          # stayed green — release evidence that is judged by its presence has to
          # fail loudly when it is absent.
          if-no-files-found: error
          path: |
            junit-docker.xml
            coverage-report.json
            discovery-comparison.json
            build-manifest.json

  # ----------------------------------------------------------- actual services
  # E-005: "dedicated actual-service jobs run on release or manual dispatch with
  # explicit opt-in variables".
  #
  # A mock service test does not substitute for pinned-service acceptance, and
  # these start a real Interactsh server and a real DefectDojo. They are opt-in
  # by repository VARIABLE rather than by trigger alone, so neither a dispatch
  # nor a release can start them unless someone has said so out of band.
  actual-services:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
      && vars.ERLIK_ACTUAL_SERVICE_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build the lane images
        run: docker compose -f docker-compose.integrations.yml --profile integrations build

      - name: Build the Interactsh lab
        run: docker build -t erlik-interactsh-lab:1 docker/interactsh-lab

      # §11 asks every release artifact to name what it was measured against, and the
      # docker job above writes one while this job — the only one that runs against real
      # pinned services — wrote none. Its junit files then said which acceptance cases
      # passed and nothing about the Interactsh server or the worker they passed against,
      # which is the half that stops being reconstructable after a rebuild.
      #
      # `--also-image` because the lab server is a fixture, not a lane image, so `IMAGES`
      # does not carry it. `zap` WILL be recorded absent here and that is correct: this job
      # does not pull it and no check in it uses one.
      - name: Record what was pinned
        run: >-
          python scripts/release_manifest.py --out build-manifest.json
          --also-image erlik-interactsh-lab:1

      - name: Real Interactsh acceptance
        env:
          ERLIK_DOCKER_TESTS: "1"
          ERLIK_REAL_INTERACTSH_TESTS: "1"
        run: python -m pytest tests/test_interactsh_completion.py -q --junitxml=junit-interactsh.xml

      # FOR THIS ONE THE FLOOR IS THE GUARD, not the ratio: 11 of 13 is 84.6%,
      # which any ratio loose enough not to cry wolf would wave through — and the
      # two that would be missing are the real-service cases this job exists for.
      - name: Assert the real Interactsh acceptance actually ran
        if: always()
        run: python scripts/ci_assert_suite_ran.py junit-interactsh.xml --floor 13 --ratio 0.95

      # No secrets, and no gate. Both were mine, and both were wrong.
      #
      # The fixture in tests/test_defectdojo_live.py mints every credential the
      # lab needs with `secrets.token_hex` and writes them to a compose
      # --env-file of its own; NOTHING reads ERLIK_DOJO_* from the process
      # environment. So the four repository secrets this step used to require
      # had no effect on anything.
      #
      # So the gate `if: env.ERLIK_DOJO_SECRET != ''` asked whether someone had
      # configured a secret that changes nothing, and skipped real acceptance
      # coverage when they had not — the exact defect E-005 exists to fix, which
      # I reintroduced one job below while fixing it. (It is also reading a
      # step's own `env:` from that step's `if:`, which is at best fragile; the
      # gate is removed rather than corrected, because there is nothing to gate
      # on.)
      #
      # It needs openssl (for the lab's TLS cert) and Docker. Both are on
      # ubuntu-latest.
      - name: Live DefectDojo acceptance
        env:
          ERLIK_DOCKER_TESTS: "1"
          ERLIK_DEFECTDOJO_LIVE_TESTS: "1"
        run: python -m pytest tests/test_defectdojo_live.py -q --junitxml=junit-defectdojo.xml

      - name: Assert the live DefectDojo acceptance actually ran
        if: always()
        run: python scripts/ci_assert_suite_ran.py junit-defectdojo.xml --floor 1 --ratio 0.95

      # Client evidence must never reach a public CI artifact (§11). These
      # suites run against lab fixtures only, and the junit files carry test
      # names and durations — not captured responses.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-service-evidence
          if-no-files-found: error
          path: |
            junit-*.xml
            build-manifest.json

  # THE CASES, AGAINST AN APPLICATION NOBODY HERE WROTE.
  #
  # `tests/targets/` proves a case fires on a planted flaw and stays silent on
  # a matched control, and it found every case defect on 2026-09-05. But those
  # targets and those cases have the same author, so a shared misunderstanding
  # of what a real application returns is invisible to that whole harness.
  # Juice Shop is the application the `juiceshop` profile already aims at, and
  # the one every reported campaign result was produced against.
  #
  # This job does NOT assert that Juice Shop is vulnerable — that is Juice
  # Shop's business and it changes between releases. It asserts that what erlik
  # REPORTS about it does not change without someone saying so, in both
  # directions: a finding that disappeared is a case that silently stopped
  # working, and one that appeared is either new coverage or a false positive.
  cases-vs-juiceshop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      juiceshop:
        # PINNED, not `latest`. On `latest` this job would go red whenever
        # Juice Shop shipped a release, for reasons that have nothing to do
        # with this repository — and the baseline it compares against is a
        # statement about one specific application build.
        image: bkimminich/juice-shop:v20.2.0
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Service containers have no healthcheck here, so the job would otherwise
      # race the application's startup and record "no findings" for a target
      # that was not listening yet — a clean bill of health from a run that
      # never reached anything.
      - name: Wait for Juice Shop
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Juice Shop never answered on :3000 — this run measured nothing"
          exit 1

      # The cases run natively here: there is no Kali container on the runner,
      # and without ERLIK_NATIVE every step is refused, which reads as a case
      # that found nothing. The script sets it for its own process.
      #
      # sqlmap, dalfox, testssl, wafw00f and whatweb are NOT installed, and the
      # four cases naming them are recorded as `unrunnable` with the missing
      # tool named rather than folded into "no findings".
      - name: Cases vs Juice Shop
        run: |
          python scripts/case_baseline.py \
            --base http://127.0.0.1:3000 \
            --profile juiceshop \
            --baseline tests/baselines/juiceshop.json \
            --out measured-juiceshop.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-juiceshop
          # The same rule the other three uploads follow. `case_baseline.py`
          # writing nothing is the failure mode that matters here -- an upload
          # step whose default is a warning would leave the job green with no
          # measurement in it at all.
          if-no-files-found: error
          path: measured-juiceshop.json
