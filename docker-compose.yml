services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - pentest-net
    restart: unless-stopped

  # Second lab target. erlik already ships 19 DVWA ground-truth entries, so it is
  # the cheapest way to check the framework generalises beyond Juice Shop rather
  # than having been tuned to it. Most of that ground truth lives under
  # /vulnerabilities/*, which DVWA puts behind a login — which also makes it a
  # real exercise of credential capture and reuse.
  dvwa:
    # digininja is DVWA's own maintainer; the widely-copied vulnerables/web-dvwa
    # image is a stale third-party build. This one is NOT all-in-one — it needs
    # the database service below, or every page dies with "Connection refused"
    # inside dvwaPage.inc.php and the whole app answers 302 to login.php.
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    depends_on:
      - dvwa-db
    environment:
      - DB_SERVER=dvwa-db
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
    ports:
      - "8081:80"
    networks:
      - pentest-net
    restart: unless-stopped

  dvwa-db:
    image: mysql:8.0
    container_name: dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    networks:
      - pentest-net
    restart: unless-stopped

  kali-tools:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: kali-tools
    depends_on:
      - juice-shop
      - dvwa
      - zap
    networks:
      - pentest-net
    environment:
      - ZAP_HOST=zap
      - ZAP_PORT=8080
    stdin_open: true
    tty: true
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    depends_on:
      - juice-shop
    networks:
      - pentest-net
    ports:
      - "8090:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=true
    restart: unless-stopped

networks:
  pentest-net:
    driver: bridge
