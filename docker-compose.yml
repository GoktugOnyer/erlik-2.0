services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - pentest-net
    restart: unless-stopped

  kali-tools:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: kali-tools
    depends_on:
      - juice-shop
      - zap
    networks:
      - pentest-net
    environment:
      - ZAP_HOST=zap
      - ZAP_PORT=8080
    stdin_open: true
    tty: true
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap
    depends_on:
      - juice-shop
    networks:
      - pentest-net
    ports:
      - "8090:8080"
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.disablekey=true
    restart: unless-stopped

networks:
  pentest-net:
    driver: bridge
