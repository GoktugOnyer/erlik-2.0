id: WSTG-SESS-02
name: Cookie Attributes
category: Session Management
attack_class: csrf
severity: medium
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/06-Session_Management_Testing/02-Testing_for_Cookies_Attributes

target_schema:
  required: [url]
  optional: [cookie, auth_header]

steps:
  - name: fetch_headers
    tool: curl
    command: >-
      curl -s -b "{{cookie}}" -H "{{auth_header}}" -i "{{url}}"
    evaluators:
      # Was an `llm` evaluator asking a model to read Set-Cookie. Parsing the
      # header answers the same question deterministically, at no token cost,
      # and cannot be talked out of the answer by the response body.
      - type: cookie_attributes
        emit_finding:
          vuln_type: Insecure Cookie Attributes
          severity: medium
