id: WSTG-CLNT-07
name: Cross Origin Resource Sharing
category: Client-side
attack_class: cors
severity: medium
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/11-Client-side_Testing/07-Testing_Cross_Origin_Resource_Sharing

target_schema:
  required: [url]
  optional: [cookie, auth_header]

steps:
  - name: origin_reflection
    tool: curl
    # An OAST-marked origin so scope enforcement permits the payload host.
    #
    # The two-step version reported `Access-Control-Allow-Origin: *` plus
    # credentials as a High. That combination is not exploitable: browsers
    # refuse the wildcard the moment credentials are attached, so the finding
    # was a false positive with a severity on it. The claim worth making is
    # narrower — the server reflected OUR origin AND allows credentials — and
    # even that is header evidence, not a browser-confirmed read, which is why
    # the vuln_type says so and the evaluator grades it `suspected`.
    command: >-
      curl -s -b "{{cookie}}" -H "{{auth_header}}" -i -H "Origin: https://evil.oast.test" "{{url}}"
    evaluators:
      - type: cors
        emit_finding:
          vuln_type: CORS Origin Reflection With Credentials (browser verification required)
          severity: medium
