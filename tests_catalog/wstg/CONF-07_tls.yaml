id: WSTG-CONF-07
name: Transport Layer Security
category: Configuration & Deployment Management
attack_class: recon
severity: high
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/07-Test_HTTP_Strict_Transport_Security

# Planned only for a TLS target. Against an http base `plan_sweep` builds a
# scope of allow_ports=[80], and this case's HSTS probe must reach 443 -- so it
# was refused by the scope guard while `tls_scan` still spent 90 seconds of
# testssl against a port the operator never declared. Half the case could not
# run and the other half should not have.
preconditions:
  scheme: https

# `port` is REQUIRED, not optional. The planner always derives it from the base
# URL, so requiring it costs a sweep nothing -- but a hand-written target that
# omits it now gets a NAMED skip instead of silently defaulting to 443 and
# reporting a verdict about a port the operator never mentioned.
target_schema:
  required: [host, port]

# THREE DEFECTS MEASURED 2026-09-05 by rendering the case, not reading it.
#
# 1. THE HSTS CHECK PROBED A DIFFERENT ENDPOINT THAN THE SCAN. `port` exists
#    precisely because the service may not be on 443, and the HSTS steps
#    ignored it:
#
#      target host=127.0.0.1 port=9023
#      tls_scan   -> testssl ... "127.0.0.1:9023"
#      hsts_check -> curl -sI "https://127.0.0.1/"      <- port 443
#
#    So the TLS verdict and the HSTS verdict described two different services,
#    or the HSTS verdict described nothing at all.
#
# 2. `port` IS OPTIONAL AND HAD NO DEFAULT. Omitted, the scan rendered as
#    `testssl ... "127.0.0.1:"`, which is not a target.
#
# 3. THE HSTS STEP COULD NOT REACH A VERDICT. `hsts_check` carried two
#    evaluators with the SAME pattern and NO `emit_finding` on either.
#    runner.py:319 emits a finding only `if ev.emit_finding`, so both were dead
#    by construction -- the step issued a request and concluded nothing. Its
#    own comments said so ("Presence means OK -- emit no finding", "If the
#    above did not match, this will not either; that is fine"). The actual
#    verdict was then delegated to `hsts_llm_judge`, which re-issued the
#    identical request and asked a model whether a header was present.
#
#    "Is this string in this output" is what a regex answers. Routing it
#    through a model meant the whole HSTS check produced NOTHING on any
#    deployment with no model reachable, which is every offline run.
#
# The HSTS half is now one deterministic step on the right port, with an
# explicit no-response verdict so an unreachable endpoint is not reported as
# missing HSTS.
#
# NOT CHANGED: `tls_scan`'s evaluators. `testssl` is not installed in this
# environment, so any edit to its patterns could not be verified against real
# output -- and `pattern: VULNERABLE|HIGH` alongside `--severity HIGH` in the
# command deserves that verification before anyone touches it.

steps:
  - name: tls_scan
    tool: testssl
    # The port is written into the command, not into a shell variable. With
    # `"{{host}}:$P"` the scope guard extracted a BARE hostname -- `$P` is not a
    # port it can read -- and `check_url` defaults a bare host to port 80, which
    # is in no https target's allow_ports. Measured 2026-09-06, before this
    # change, on every https target shape:
    #
    #   https://app.example.test        tls_scan REFUSED (port 80)
    #   https://app.example.test:443    tls_scan REFUSED (port 80)
    #   https://app.example.test:8443   tls_scan REFUSED (port 80)
    #
    # This step had never run, anywhere. `{{host}}:{{port}}` gives the guard the
    # endpoint the step actually contacts.
    command: >-
      testssl --quiet --color 0 --severity HIGH --warnings off "{{host}}:{{port}}"
    evaluators:
      - type: regex
        pattern: 'VULNERABLE|HIGH'
        emit_finding:
          vuln_type: Weak TLS Configuration
          severity: high
      - type: regex
        pattern: 'SSLv2|SSLv3|TLS 1\.0|TLS 1\.1'
        emit_finding:
          vuln_type: Deprecated TLS Protocol Enabled
          severity: high

  - name: hsts_header
    tool: curl
    # The URL carries its own port, so the literal the guard extracts is the
    # endpoint this step actually contacts. It used to be assembled from
    # `U="https://{{host}}"` plus `:$P` at runtime, which meant the guard read
    # `https://app.example.test` and scored it as port 443 -- so on a service on
    # 8443, the exact case `port` exists for, the step was refused.
    #
    # No -k: a certificate this client will not accept is a finding for
    # tls_scan to report, and answering "missing HSTS" off a connection that
    # was never established would be a verdict about nothing.
    #
    # `-D - -o /dev/null` rather than `-sI`, which sends HEAD. Measured against
    # a local TLS server with no HEAD handler: 501, no headers, and the case
    # would have reported Missing HSTS for a service whose GET sets it. This
    # takes the response headers off a real GET and discards the body, the same
    # way CLNT-07b reads CORS headers.
    command: >-
      bash -c 'H=$(curl -s -D - -o /dev/null --connect-timeout 5 --max-time 15 -w "HTTPCODE=%{http_code}" "https://{{host}}:{{port}}/");
      CODE=$(printf "%s" "$H" | grep -o "HTTPCODE=[0-9]*" | tail -1 | cut -d= -f2);
      printf "%s\n" "$H";
      if [ "$CODE" = "000" ]; then
        echo "ERLIK_HSTS_NO_RESPONSE: no response was received over TLS on port {{port}}, so whether the service sets HSTS was not assessed";
      elif printf "%s" "$H" | grep -qi "^Strict-Transport-Security:"; then
        echo "ERLIK_HSTS_PRESENT: the service sets Strict-Transport-Security";
      else
        echo "ERLIK_HSTS_ABSENT: the service answered over TLS on port {{port}} and set no Strict-Transport-Security header";
      fi'
    evaluators:
      - type: regex
        pattern: 'ERLIK_HSTS_ABSENT'
        emit_finding:
          vuln_type: Missing HSTS
          severity: medium
