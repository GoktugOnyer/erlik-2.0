id: WSTG-BUSL-04
name: Process Timing / Race Condition
category: Business Logic
attack_class: logic
severity: high
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/10-Business_Logic_Testing/04-Test_for_Process_Timing

# Typical use: redeem a single-use coupon / withdraw funds / apply a discount.
# `request_template` is a curl command body the user supplies — we fire it
# `parallel_n` times and count how many attempts succeeded when only one
# should have.
#
# TWO DEFECTS MEASURED 2026-09-05, both of which made this case report a clean
# run it had not performed.
#
# 1. `parallel_n` is optional, and nothing supplied a default. Omitted, the
#    step rendered as
#
#        for i in $(seq 1 ); do (...) & done; wait
#
#    which fires ZERO requests. `wait` returns 0, so the step reported success
#    with empty output and the case reported nothing — a race-condition test
#    that sent no requests, presented as a clean result. It now defaults to 10
#    and says how many it fired.
#
# 2. The verdict was `({{success_marker}}.*){2,}`. `.` does not cross a
#    newline, so both successes had to land on the SAME LINE. Measured against
#    five concurrent successes:
#
#        REDEEM_OKREDEEM_OK...           (no trailing newline)  -> matched
#        "REDEEM_OK applied\n" x 5                             -> NO MATCH
#        pretty-printed JSON bodies x 3                         -> NO MATCH
#
#    Every API that ends its body with a newline — which is most of them —
#    won the race five times out of five and was reported clean. The count is
#    now done with `grep -c`, which does not care where the newlines fall.
#
# The marker is counted LITERALLY (`grep -F`), not as a regex. It is called a
# marker, an operator will type one, and a `$` or `.` in a JSON snippet should
# not silently change what is counted.
target_schema:
  required: [request_template, success_marker]
  # No auth field here on purpose: this case fires the operator's own
  # `request_template` verbatim, so a session belongs INSIDE that
  # template. Declaring `auth_header` promised something the case has
  # no way to apply — and a promise the engine keeps on a case's behalf
  # is one the case then breaks, silently.
  optional: [parallel_n]

steps:
  - name: race_burst
    tool: curl
    # WRAPPED, AND THE OPERATOR'S REQUEST IS AN ARGUMENT RATHER THAN TEXT.
    #
    # Two measured constraints meet here and each one breaks the obvious answer to
    # the other.
    #
    # 1. The step must be wrapped. `_command_segments` splits at every point a new
    #    program name can appear and `_segment_violation` checks each segment, so a
    #    step writing `case`, `for` or `(` directly is refused before any request
    #    goes out -- "command segment runs 'case', which is not in this session's
    #    toolset". A refused step reads like a missing tool and the case above it
    #    reads as clean. `bash -c '...'` is what every other shell-writing case does
    #    and what the guard admits via the declared `tool:`.
    #
    # 2. The operator's request may not be INTERPOLATED into that wrapper. The
    #    executor already runs the whole string through `bash -c`
    #    (tool_executor._sync_docker_exec), so the wrapper is a second shell and its
    #    single quotes collide with the operator's own. Measured against a lab
    #    endpoint with no usage limit at all: a template carrying
    #    `-H 'Authorization: Bearer ...'` -- how any authenticated function is called
    #    -- rendered as broken shell and the case reported CLEAN, while the same
    #    template unquoted worked. The case found race conditions only on targets
    #    that need no authentication.
    #
    # So the template is passed POSITIONALLY and sits outside the quotes: the outer
    # shell parses it once, where the operator wrote it, and the inner shell receives
    # it as argv and runs `("$@")` without re-parsing anything. The operator's quoting
    # is honoured and never meets the wrapper's. `$1` is the burst size and `$2` the
    # marker for the same reason.
    #
    # TWO EARLIER DEFECTS, both of which made this case report a clean run it had not
    # performed, and both still closed by the script below.
    #
    # 1. `parallel_n` is optional and nothing supplied a default. Omitted, the step
    #    rendered as `for i in $(seq 1 ); do (...) & done; wait`, which fires ZERO
    #    requests. `wait` returns 0, so the step reported success with empty output
    #    and the case reported nothing. It now defaults to 10 and says how many it
    #    fired.
    #
    # 2. The verdict was `({{success_marker}}.*){2,}`. `.` does not cross a newline,
    #    so both successes had to land on the SAME LINE. Measured against five
    #    concurrent successes: a body with no trailing newline matched, and
    #    "REDEEM_OK applied\n" x 5 did not. Every API that ends its body with a
    #    newline -- which is most of them -- won the race five times out of five and
    #    was reported clean. The count is now done with `grep -oF`, which does not
    #    care where the newlines fall and counts the marker LITERALLY: an operator
    #    types a marker, and a `$` or `.` in a JSON snippet should not silently
    #    change what is counted.
    #
    # THE THIRD OUTCOME IS THE POINT OF THE CANARIES. A run where the request never
    # succeeded even once says nothing about process timing, and used to be
    # indistinguishable from an enforced control. The verdict is emitted by the
    # script rather than matched through a substituted pattern, so it does not depend
    # on a model being reachable.
    command: >-
      bash -c 'N="$1"; MARKER="$2"; shift 2;
      case "$N" in ""|*[!0-9]*) N=10;; esac;
      if [ "$N" -lt 2 ]; then N=10; fi;
      OUT=$(for i in $(seq 1 "$N"); do ("$@") & done; wait);
      HITS=$(printf "%s" "$OUT" | grep -oF "$MARKER" | wc -l | tr -d " ");
      echo "requests_fired=$N successes=$HITS";
      printf "%s\n" "$OUT";
      if [ "$HITS" -gt 1 ]; then
      echo "ERLIK_BUSL_RACE: the request succeeded $HITS times out of $N fired in parallel, on an endpoint that should succeed at most once";
      elif [ "$HITS" -eq 1 ]; then
      echo "ERLIK_BUSL_SINGLE_SUCCESS: exactly one of $N parallel requests succeeded, which is the correct behaviour";
      else
      echo "ERLIK_BUSL_NO_SUCCESS: none of the $N requests contained the success marker, so the request never succeeded even once and this run says nothing about process timing";
      fi' erlik-busl-04 "{{parallel_n}}" "{{success_marker}}" {{request_template}}
    evaluators:
      - type: regex
        pattern: 'ERLIK_BUSL_RACE'
        emit_finding:
          vuln_type: Race Condition (multiple successes)
          severity: high
      - type: llm
        # Only where the request DID succeed once and the marker count found
        # nothing more. Two successful responses can differ in ways a single
        # marker cannot count -- two transaction ids, two confirmations -- and
        # that is the only thing left for a model to add here.
        when: no_finding_yet
        instruction: >-
          We fired the same request N times in parallel against an endpoint
          that is supposed to succeed at most once (e.g. a coupon redeem or a
          balance withdrawal). The output begins with a summary line, then the
          concatenated responses, then a verdict line. If the verdict is
          ERLIK_BUSL_NO_SUCCESS, set matched=false — the request never
          succeeded, so nothing can be concluded. Otherwise set matched=true
          only if you can see TWO DISTINCT successful responses that the marker
          count would not have caught, such as two different transaction IDs or
          two separate confirmations. Otherwise matched=false.
        emit_finding:
          vuln_type: Race Condition (LLM-judged multiple successes)
          severity: high
