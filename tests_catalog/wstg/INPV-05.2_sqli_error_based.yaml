id: WSTG-INPV-05.2
name: SQL Injection (error-based, single request)
category: Input Validation
attack_class: sqli
severity: high
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05-Testing_for_SQL_Injection

# WHY THIS EXISTS ALONGSIDE WSTG-INPV-05.
# INPV-05 is the fuller SQL injection case and it runs `bash -c` and sqlmap, so
# the assessment lane — whose executor accepts one curl per step and no shell —
# cannot run it. The 2026-09-09 lab baseline recorded the consequence: the lane
# reached DVWA's injectable `id` parameter, the application answered with
# `Uncaught mysqli_sql_exception`, and NOTHING in the runnable set was looking
# for a database error.
#
# WHAT IT CANNOT SEE.
#
# An injection that emits no error at all is invisible to anything reading one
# response. WSTG-INPV-05.3 (boolean differential) and WSTG-INPV-05.4
# (time-based) are the cases for that.
#
# A NON-ENGLISH DEPLOYMENT. Every alternative below is an English engine
# sentence or a code bound to its English message, and four of the seven Oracle
# codes are server-translated by NLS. Only ORA-01756 — the one the single-quote
# payload actually provokes — stays English in every language, and that is luck
# rather than design. On a localized target this case reports nothing and says
# nothing about why, which is the worst shape a detector has.
#
# A WRAPPER THAT NAMES NO ENGINE. `org.hibernate.exception.SQLGrammarException:
# could not prepare statement`, `BadSqlGrammarException`, a bare
# `System.Data.SQLite.SQLiteException`. These are real errors and they are
# byte-identical to a line in an issue tracker, a Javadoc page or an OpenAPI
# error enum. Every alternative that would catch them was measured to cost
# between one and six false positives and to buy at most two; they are kept as
# fixtures in sql_error_pages.UNREACHABLE_ERRORS so the blind spot is a test.
#
# AN APPLICATION THAT ESCAPED THE QUOTE CORRECTLY still answers with an error —
# a TYPE-conversion error, not a syntax one: PostgreSQL's `invalid input syntax
# for type integer`, SQL Server's `Conversion failed when converting the varchar
# value`, Oracle's ORA-01722. Those say the injection FAILED, and they are in
# the benign corpus for that reason. Nothing here may match them.

target_schema:
  required: [url, parameter]
  optional: [cookie, auth_header]

# THE PATTERN, AND HOW IT WAS ARRIVED AT.
#
# Measured against 63 real database-error bodies and 105 benign pages —
# 31 engine/driver/ORM combinations produced live plus every page an adversarial
# round used to break an earlier version. Recorded in
# docs/measurements/2026-09-09-sql-error-signatures.md.
#
#     INPV-05's pattern      31/63 recall   38/105 false positives
#     this pattern's v1      54/63 recall   31/105 false positives
#     this pattern           57/63 recall    1/105 false positives
#
# v1 was tuned against eleven benign pages, which was far too easy a negative
# corpus: `java\.sql\.SQLException` cost six false positives and bought ZERO
# real errors, and bare `SQLSTATE\[…\]` fired on a Laravel blog post, a hidden
# form field and a filter message.
#
# THREE RULES, EACH OF WHICH A DROPPED ALTERNATIVE BROKE.
#
# 1. A CLASS OR NAMESPACE NAME IS NOT AN ERROR. `java.sql.SQLException`,
#    `SQLite3::`, `sqlite3.`, `org.hibernate.exception.*` and
#    `System.Data.SqlClient` name types. They appear in Javadoc, in an `import`
#    line, in a `rescue` clause, in an OpenAPI error enum and in an
#    issue-tracker title. One `/openapi.json` publishing an error-code enum
#    broke seven of them at once.
#
# 2. AN ERROR CODE MUST CARRY ITS MESSAGE. `ORA-\d+` fired on `Aurora-2024`,
#    on ORA-prefixed ticket keys, and on `Invalid parameter ORA-00933: expected
#    integer` — which an application can be made to render. Each Oracle code
#    below is bound to its canonical text.
#
# 3. A DOCUMENTATION PAGE CARRIES THE MESSAGE TOO. MySQL's own manual renders
#    `near '%s' at line 1`; Microsoft's error table renders `'%.*ls'`. Both are
#    excluded by lookahead rather than by hoping the page is never crawled.
#
# SQLITE HAS TWO ANSWERS TO A LONE QUOTE, AND THE LAB PROVED IT.
# `unrecognized token` is what the tokenizer says when the quote opens a string
# it never closes. But `erlik'probe` closes one — SQLite reads `'erlik'` as a
# complete string and then trips on the identifier after it, giving a parser row
# instead: `SQLITE_ERROR: near "probe": syntax error`. That is exactly what the
# lab's own Juice Shop returns, at HTTP 500, on
# /rest/products/search?q=erlik%27probe — a genuine, reachable, error-based SQL
# injection this case reported NOTHING for until the parser alternative was
# added. `SQLITE_ERROR` alone cannot be that alternative: it fires on Juice
# Shop's own JavaScript bundle, which describes the challenge in prose. The
# engine marker and the parser grammar together fire on the 500 and not on the
# 456KB bundle, measured against both live.
#
# THE ANTI-ECHO GUARD ON THE SQLITE TOKEN ALTERNATIVE. A search DSL and a CSP report
# endpoint both answered a lone quote with `unrecognized token: "'"`, echoing
# the offending character back. SQLite's real message reports the whole
# unterminated token, so it carries the REST of the payload — `"'probe"` for the
# payload below. Requiring one more character after the quote removed both false
# positives and cost no recall across fifteen SQLite bodies.
#
# `case_insensitive: false`, AND THE REASON IS NOT THE OBVIOUS ONE.
#
# The obvious reason is weak. A lowercased digest of the MySQL 1064 message does
# match under IGNORECASE and not without it — but a page like that reads the
# same before and after the payload, so the comparison below already drops it
# and the flag changes nothing.
#
# Two reasons that survive. First, an accident the flag prevents: under
# IGNORECASE the libpq branch's leading `ERROR:` is satisfied by the tail of a
# CLASS NAME, so `psycopg2.errors.SyntaxError: syntax error at or near "`
# matches through `Error: ` — a branch firing through a token it was never
# written to read. Second, the case the comparison genuinely cannot see: a WAF
# or input validator that answers a quote with a canned, lowercased SQL-
# injection signature and no database behind it at all. That is payload-
# dependent, so it differs from the baseline, and only the flag excludes it.
#
# What this does NOT establish is that the flag is free. A corpus of
# English-cased bodies cannot contain the thing it would cost — an injectable
# application whose error rendering lowercases is found with IGNORECASE on and
# missed silently with it off. The trade is deliberate and it is not measured.
#
# ESCAPING IS APPLIED PER BRANCH, BY MEASUREMENT. Every delimiter is written as
# an alternation over the raw byte and its HTML entity forms, because the moment
# an application calls htmlspecialchars — which is what a framework is for — a
# literal `'` stops matching. Produced live from PHP 8 against the lab's MySQL:
# `near &#039;probe&#039;&#039; at line 1`. JSON's backslash form is added only
# on the SQLite token branch, where it was measured to buy two real bodies; on
# the psycopg branch it bought none and cost a false positive, so it is absent
# there.
#
# NO BRANCH ANCHORS ON A TRAILING ` at line N`. MySQL embeds the rest of the
# statement in the message, newlines and all, so a query written across lines —
# which every query builder and heredoc does — puts a newline inside any
# line-scoped span. Produced live: `near 'probe'\n  AND id > 0\nORDER BY id' at
# line 2`. The 120 characters of fixed engine sentence are the anchor; the
# lookahead for `%s` is what excludes MySQL's own manual.
#
# THE PHP DRIVER-WARNING ALTERNATIVE IS NOT WHAT IT LOOKS LIKE. It is not a
# `mysqli_query()` warning — that function does not warn on a SQL error on PHP 7
# either, because report_mode defaults to OFF there. It is the DOWNSTREAM
# warning from feeding an unchecked `false` into a fetch, which is why it
# matches `mysqli?_\w+\(\)` generally rather than one function. And "PHP 8 no
# longer warns" is simply false: produced live on PHP 8.5.3 in the lab, an
# application calling `mysqli_report(MYSQLI_REPORT_ERROR)` without STRICT still
# emits `Warning:  mysqli::query(): (42000/1064): You have an error in your SQL
# syntax...`.
#
# So `Warning.*mysqli?_` is rejected for its `.*`, not for PHP's behaviour —
# on PHP 8.5.3 it fires on `Warning: Undefined array key "mysql_id"`, a response
# with no database anywhere in it, and one this lane manufactures itself when it
# guesses a parameter name. A justification that is factually wrong is a landmine
# for whoever revises this next; they will find the warning and put the
# alternative back.
#
# That alternative also has a false-positive mode of its own: on a legacy
# unchecked-result application ANY failing query — a missing table, a permission
# error, a dropped connection — produces the identical bytes. That is precisely
# what the baseline comparison below is for.
#
# THE ONE FALSE POSITIVE THAT SURVIVES the pattern is a Stack Overflow page
# whose title is `psycopg2.errors.SyntaxError: syntax error at or near "ON"`.
# The bytes are identical to a finding and no body-only regex separates them.
# What closes it is the comparison below rather than the pattern: the title is
# on the page before the payload is sent, so it is not evidence about the
# payload.


steps:
  - name: benign_baseline
    tool: curl
    # THE REFERENCE RESPONSE. Not a gate — a page that already carries a
    # database error is not thereby exempt from having one MORE caused in it.
    #
    # Measured against real MySQL 8.0 on an unquoted numeric sink, which is the
    # easiest SQL injection there is to exploit because it needs no quote to
    # escape: this benign value already returns `Unknown column
    # 'erlikprobebaseline' in 'where clause'`, one of the alternatives below,
    # while the payload returns `You have an error in your SQL syntax` and
    # `1 OR 1=1` returns every row. Stopping on the mere PRESENCE of a
    # signature here would drop that parameter — silently, and without even
    # chaining it to sqlmap.
    #
    # So this step carries no evaluator at all. Each payload step below names
    # it in `differs_from`, and reports only when its own response DIFFERS from
    # this one. A documentation page, an error-code table, an OpenAPI enum and
    # a Stack Overflow question all answer both requests identically and are
    # dropped; a 1054 turning into a 1064 is reported, which is what it is.
    command: >-
      curl -s -b "{{cookie}}" -H "{{auth_header}}" -G "{{url}}" --data-urlencode "{{parameter}}=erlikprobebaseline"

  - name: single_quote
    tool: curl
    # The classic: harmless to send, and it terminates a string literal in
    # every engine below. `probe` after the quote is not decoration — it is
    # what puts the payload inside the token SQLite reports back.
    command: >-
      curl -s -b "{{cookie}}" -H "{{auth_header}}" -G "{{url}}" --data-urlencode "{{parameter}}=erlik'probe"
    evaluators:
      - type: regex
        case_insensitive: false
        pattern: &sql_error_signature |-
          You have an error in your SQL syntax; check the manual that (?:corresponds to|fits) your (?:MySQL|MariaDB|Drizzle|TiDB) server version for the right syntax to use near (?:'|&#0*39;|&#x0*27;|&apos;)(?!%s(?:'|&#0*39;|&#x0*27;|&apos;) at line)|ERROR:\s{1,2}(?:unterminated quoted string|syntax error) at or near (?:"|&quot;|&#0*34;|&#x0*22;)|(?:psycopg2?\.errors\.|asyncpg\.exceptions\.)\w*Error: (?:unterminated quoted string|syntax error) at or near (?:"|&quot;|&#0*34;|&#x0*22;)|"code"\s*:\s*"42601"[\s\S]{0,160}?"message"\s*:\s*"(?:unterminated quoted string|syntax error) at or near|unrecognized token: (?:"|&quot;|&#0*34;|&#x0*22;|\\")(?:'|&#0*39;|&#x0*27;|&apos;)(?!(?:"|&quot;|&#0*34;|&#x0*22;|\\"))|(?:SQLITE_ERROR|sqlite3?\.\w*Error|SQLite3?::\w*Exception|in prepare, )[^\n]{0,60}?near (?:"|&quot;|&#0*34;|&#x0*22;)[^"\n&]{0,60}?(?:"|&quot;|&#0*34;|&#x0*22;): syntax error|Unclosed quotation mark after the character string (?!'%\.\*ls')(?:'|&#0*39;|&#x0*27;|&apos;)[\s\S]{0,80}?(?:'|&#0*39;|&#x0*27;|&apos;)\.|Incorrect syntax near (?:'|&#0*39;|&#x0*27;|&apos;)[\s\S]{0,60}?(?:'|&#0*39;|&#x0*27;|&apos;)(?:'|&#0*39;|&#x0*27;|&apos;)|(?:System|Microsoft)\.Data\.SqlClient\.SqlException: Incorrect syntax near (?:'|&#0*39;|&#x0*27;|&apos;)|Microsoft OLE DB Provider for (?:SQL Server|ODBC Drivers) error '[0-9a-f]{8}'|ORA-(?:01756: quoted string not properly terminated|00933: SQL command not properly ended|00911: invalid character|00936: missing expression|00907: missing right parenthesis|00923: FROM keyword not found where expected|01789: query block has incorrect number of result columns)|DPY-2041: missing ending quote|SQLSTATE\[[0-9A-Z]{5}\]: Syntax error or access violation: \d+ |Unknown column (?:'|&#0*39;|&#x0*27;|&apos;)[^'\n&]{0,64}(?:'|&#0*39;|&#x0*27;|&apos;) in (?:'|&#0*39;|&#x0*27;|&apos;)(?:where clause|field list|SELECT|on clause|having clause|order clause|group statement)(?:'|&#0*39;|&#x0*27;|&apos;)|mysqli?_\w+\(\)[^\n]{0,60}(?:expects parameter|supplied (?:argument|resource) is not a valid)
        differs_from: benign_baseline
        emit_finding:
          vuln_type: SQL Injection (error-based — the parameter reaches a database query)
          severity: high
        stop_after: true

  - name: double_quote
    tool: curl
    # Some applications escape `'` and not `"`, and some engines quote
    # identifiers with `"` — the same break, through the other delimiter.
    when: no_finding_yet
    command: >-
      curl -s -b "{{cookie}}" -H "{{auth_header}}" -G "{{url}}" --data-urlencode "{{parameter}}=erlik\"probe"
    evaluators:
      - type: regex
        case_insensitive: false
        pattern: *sql_error_signature
        differs_from: benign_baseline
        emit_finding:
          vuln_type: SQL Injection (error-based — the parameter reaches a database query)
          severity: high
        stop_after: true

  - name: closing_paren
    tool: curl
    # `')` breaks out of a function call or an IN (...) list, which a bare
    # quote inside those constructs does not.
    when: no_finding_yet
    command: >-
      curl -s -b "{{cookie}}" -H "{{auth_header}}" -G "{{url}}" --data-urlencode "{{parameter}}=erlik')probe"
    evaluators:
      - type: regex
        case_insensitive: false
        pattern: *sql_error_signature
        differs_from: benign_baseline
        emit_finding:
          vuln_type: SQL Injection (error-based — the parameter reaches a database query)
          severity: high
        stop_after: true

chain:
  on_finding:
    # A parameter that reaches the query is worth the fuller treatment.
    - WSTG-INPV-05
