id: WSTG-AUTHZ-04
name: Insecure Direct Object References
category: Authorization
attack_class: authz
severity: high
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/05-Authorization_Testing/04-Testing_for_Insecure_Direct_Object_References

# Compares a privileged response against a lower-privileged one, and against
# an ANONYMOUS one. This case had been a named skip on every recorded run, and
# when it did run it could not have concluded anything:
#
#   * It required low_priv_token / high_priv_token and sent
#     `-H "Authorization: Bearer ..."`, so it was BEARER-ONLY by construction.
#     `auth_inputs` correctly withholds those handles for a cookie session, so
#     on DVWA — and on most PHP/Rails/Django apps — no number of verified
#     sessions could satisfy it. It now accepts either material, per role, via
#     `required_any`.
#
#   * Its only finding path was an LLM judge shown ONLY the low-privilege
#     response, with the instruction "you are given the response a
#     low-privileged user got". It never saw the privileged response, so it
#     could not tell a leak from a resource that is simply public — and with
#     no model reachable it produced no verdict at all. The comparison is now
#     deterministic and happens in the step itself.
#
#   * Its first step asserted `^[45]\d\d` against a body (the command had no
#     `-w "%{http_code}"`) under `when: previous_failure` — on the FIRST step,
#     where there is no previous step. It could never fire.
#
# THE THREE-WAY DIFFERENTIAL, and why two responses are not enough.
# `low == high` alone is not a finding: a public asset is identical for
# everyone. `low != high` alone is not a clean bill of health either: on any
# app with a per-session CSRF token or a username in the chrome, EVERY page
# differs. So the anonymous fetch is the control that separates them, exactly
# as login._verify uses an anonymous probe to tell a real session from a
# status code:
#
#   low == high AND low != anon   the low user sees the privileged response,
#                                 and that is not merely the public view  -> FINDING
#   low == anon                   the low user is being treated as anonymous;
#                                 this says nothing about IDOR             -> no finding
#   low != high                   something is discriminating              -> no finding
#
# Bodies are normalised before hashing (32-hex CSRF tokens and whitespace
# removed) because otherwise the token alone makes every response unique and
# the comparison is noise. That normalisation is deliberately narrow: it
# cannot mask a difference in the DATA, which is what the test is about.
#
# RE-MEASURED against DVWA /vulnerabilities/authbypass/get_user_data.php, which
# returns the full user table. THIS CASE REPORTS NOTHING THERE, AT ANY LEVEL —
# and that is the right answer:
#
#   security=low         all three arms get the 273-byte table   -> no finding
#   security=medium      all three arms get the 273-byte table   -> no finding
#   security=high        gordonb gets the anonymous response     -> no finding
#   security=impossible  gordonb gets the anonymous response     -> no finding
#
# The table above USED to read "-> FINDING" for low and medium, and that was
# measured before `config_cookie` put the security level on every arm. DVWA's
# level is a caller-supplied cookie (dvwaPage.inc.php:200 returns $_COOKIE
# ['security'] when set, else "impossible"), so once the ANONYMOUS arm carries
# `security=low` too it receives the same table — measured: 273 bytes with the
# cookie, 41 bytes `{"result":"fail","error":"Access denied"}` without it.
#
# That is missing AUTHENTICATION, not broken authorization: the endpoint serves
# the user table to anybody who sets a cookie. The anonymous clause is what
# declines to call it an IDOR, and it is working. The stale row is recorded
# rather than deleted because it is the exact hazard this project keeps
# finding — a verdict table that was true when written, and was not re-measured
# after the behaviour it describes was changed one commit later.
#
# The real positive control is Juice Shop `GET /api/Users` with the marker
# `"email":"admin@juice-sh.op"`: admin 200, jim 200, anonymous 401.
#
# /dvwa/css/main.css is identical for all three arms, so the `low != anon`
# clause also refuses to call a public asset an IDOR.

target_schema:
  required: [url_template, private_object_marker]
  # Either material satisfies a role. They are NOT interchangeable — a cookie
  # in a Bearer header authenticates nothing — so the step is written to send
  # whichever it was actually given.
  required_any:
    - [high_priv_token, high_priv_cookie]
    - [low_priv_token, low_priv_cookie]
  optional: [object_ids, config_cookie]

# WHY THE VERDICT MOVED OFF THE BODY HASH.
#
# The three fetches were normalised, hashed, and compared: `low == high` meant
# IDOR. That fires on anything two identities legitimately see the same, which on
# a real API is a large class. Measured over 3 seeded violations and 11 negative
# controls on Juice Shop v17.1.1:
#
#     the body hash                  5 false positives, 0 false negatives
#     the marker + anonymous arm     0 false positives, 0 false negatives
#     the marker, anonymous arm off  3 false positives, 0 false negatives
#
# The five it reported on clean endpoints:
#
#     GET /rest/basket/99999         200 {"data":null} to both    — absent object
#     GET /api/Users/99999           404 Not Found to both        — absent object
#     GET /rest/basket/2             the low identity's OWN basket
#     GET /rest/products/1/reviews   public, identical to everyone
#     GET /api/Addresss/1            400 "Malicious activity" to both
#
# The last one is the sharpest: a hash comparison cannot tell "both identities were
# REFUSED" from "both identities got the object", because both are `low == high`.
# Two identical denials were reported as a shared secret.
#
# So the verdict is now the typed `idor` evaluator, which asks a different
# question: did the privileged object — named by a marker the OPERATOR supplies —
# reach the low-privilege arm, while not reaching an anonymous one? The asymmetry is
# the safety property: the marker is ours and the responses are the target's, so a
# target can cost itself a finding and cannot manufacture one.
#
# The fetches stay in `bash -c`. The case is not lane-runnable regardless — its
# `required_any` credential alternatives are something the assessment lane has
# nothing to choose between — and a conditional `${HT:+-H ...}` is what lets one
# command send a bearer token or a cookie according to which the role actually has.

steps:
  - name: fetch_as_high_priv
    tool: curl
    # The baseline. If the privileged identity cannot see the object either, there
    # is no privileged object here and nothing to compare — which is how four of
    # the five false positives above are refused.
    command: >-
      bash -c 'HT="{{high_priv_token}}"; HC="{{high_priv_cookie}}";
      CC="{{config_cookie}}";
      curl -s -i ${HT:+-H "Authorization: Bearer $HT"} ${HC:+-b "$HC"}
      ${CC:+-b "$CC"} "{{url_template}}"'

  - name: fetch_anonymously
    tool: curl
    # The control that separates a leak from a publication. Content the application
    # serves to nobody-at-all is public however it is attributed, and without this
    # arm the check reports `/rest/products/1/reviews` — every reviewer's email
    # address, readable by anyone — as a critical authorization failure.
    # It carries the CONFIGURATION and no identity. On DVWA the security level is a
    # cookie, and an arm that sent nothing was evaluated against a hardened
    # application rather than the one the other two arms saw — so the marker was
    # absent for the wrong reason and the case reported a HIGH finding on data DVWA
    # publishes to anyone. curl merges multiple -b options, so this rides alongside
    # an identity cookie in the arms that have one.
    command: >-
      bash -c 'CC="{{config_cookie}}";
      curl -s -i ${CC:+-b "$CC"} "{{url_template}}"'

  - name: fetch_as_low_priv
    tool: curl
    # Last, because the evaluator reads the two arms above from the prior steps.
    command: >-
      bash -c 'LT="{{low_priv_token}}"; LC="{{low_priv_cookie}}";
      CC="{{config_cookie}}";
      curl -s -i ${LT:+-H "Authorization: Bearer $LT"} ${LC:+-b "$LC"}
      ${CC:+-b "$CC"} "{{url_template}}"'
    evaluators:
      - type: idor
        baseline_step: fetch_as_high_priv
        anonymous_step: fetch_anonymously
        emit_finding:
          vuln_type: Broken Access Control (low-privilege session reads privileged data)
          severity: high

chain:
  on_finding:
    # An object the wrong user can READ is often one they can also enumerate.
    - WSTG-AUTHZ-05
