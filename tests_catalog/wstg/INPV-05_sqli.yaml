id: WSTG-INPV-05
name: SQL Injection
category: Input Validation
attack_class: sqli
severity: high
references:
  - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05-Testing_for_SQL_Injection

# `submit` is not decoration. DVWA runs its query only when
# `isset($_GET['Submit'])`, so a request without that token renders the page
# and touches the database not at all — which reads as CLEAN. Same reason
# BUSL-09 needs `Upload=Upload` and the login form needed `Login`. Optional,
# and omitted entirely when unset, so a target that needs nothing is unchanged.
target_schema:
  required: [url, parameter]
  optional: [method, auth_header, cookie, submit]

steps:
  - name: baseline
    tool: curl
    # `%{redirect_url}` is carried so the gate below can tell "the endpoint
    # answered" from "the endpoint bounced me to a login form".
    command: >-
      bash -c 'S="{{submit}}"; curl -s -b "{{cookie}}" -H "{{auth_header}}"
      -o /dev/null -w "%{http_code} %{redirect_url}"
      "{{url}}?{{parameter}}=1${S:+&$S}"'
    evaluators:
      # STOP if this is a redirect to a login page. A 302 to /login.php means
      # "you are not authenticated", and it matched the reachability gate
      # below — so every later step probed an empty redirect body, found
      # nothing, and the case reported CLEAN on a page it never reached.
      # Measured on DVWA: baseline 302, error probe output "", sqlmap nothing,
      # 0 findings, while the same URL with a session cookie and Submit
      # returns "You have an error in your SQL syntax" — the exact string the
      # probe below matches. A case that cannot reach its target must say so,
      # not return a verdict.
      - type: regex
        pattern: '^3\d\d\s+\S*(log[-_]?in|signin|sign-in|auth|session|sso)'
        stop_after: true
      - type: regex
        pattern: '^[23]\d\d\s'
        # Baseline check only — no finding emitted, just gates next steps.
      - type: regex
        pattern: '^[45]\d\d\s'
        when: previous_failure
        stop_after: true

  - name: error_based_probe
    tool: curl
    # Use a string likely to be present in a real table + single quote to
    # provoke a parse error (q=1' often returns empty data because '1' just
    # doesn't match any row). The follow-on probes broaden the payload set.
    # ONE PAYLOAD, NOT TWO. `' OR '1'='1` used to be sent here as well, and it
    # was worse than wasted. Measured across 7 sink shapes x 5 engines: there is
    # no combination where it errors and `apple'` does not, and in 20 of the 35
    # `apple'` errors where it does not — strict dominance, so it can never add
    # a detection.
    #
    # What it CAN do is decide one. In a quoted sink — the common injectable
    # shape — it is a boolean payload that succeeds, so the application returns
    # its whole table into the same buffer the evaluator scans. That hands the
    # target the bytes that decide a HIGH finding, which is the evidence-forgery
    # shape this catalogue keeps having to close.
    command: >-
      bash -c 'S="{{submit}}"; C="{{cookie}}";
      curl -s ${C:+-b "$C"} "{{url}}?{{parameter}}=apple%27${S:+&$S}"'
    evaluators:
      - type: regex
        # THE SAME SIGNATURE AS WSTG-INPV-05.2, BYTE FOR BYTE. YAML anchors do
        # not cross files, so it is duplicated here and
        # test_both_sqli_cases_carry_the_identical_signature keeps the copies
        # honest. The corpus, the rationale and the measured scores are all in
        # INPV-05.2's header — do not edit this copy on its own.
        #
        # What was here before scored 31/66 recall and 38/113 false positives
        # against that corpus, and two of its alternatives could not match
        # ANYTHING: written as a folded `>-` scalar across four lines, YAML
        # joined them with a space, so ` SQLITE_ERROR` and
        # ` Microsoft OLE DB Provider for SQL Server` were loaded with a leading
        # space nobody wrote. That is why the scalar below is `|-` on one line,
        # and why test_no_catalogue_pattern_was_damaged_by_yaml_folding now
        # fails on the shape instead of on the consequence.
        case_insensitive: false
        pattern: |-
          You have an error in your SQL syntax; check the manual that (?:corresponds to|fits) your (?:MySQL|MariaDB|Drizzle|TiDB) server version for the right syntax to use near (?:'|&#0*39;|&#x0*27;|&apos;)(?!%s(?:'|&#0*39;|&#x0*27;|&apos;) at line)|ERROR:\s{1,2}(?:unterminated quoted string|syntax error) at or near (?:"|&quot;|&#0*34;|&#x0*22;)|(?:psycopg2?\.errors\.|asyncpg\.exceptions\.)\w*Error: (?:unterminated quoted string|syntax error) at or near (?:"|&quot;|&#0*34;|&#x0*22;)|"code"\s*:\s*"42601"[\s\S]{0,160}?"message"\s*:\s*"(?:unterminated quoted string|syntax error) at or near|unrecognized token: (?:"|&quot;|&#0*34;|&#x0*22;|\\")(?:'|&#0*39;|&#x0*27;|&apos;)(?!(?:"|&quot;|&#0*34;|&#x0*22;|\\"))|(?:SQLITE_ERROR|sqlite3?\.\w*Error|SQLite3?::\w*Exception|in prepare, )[^\n]{0,60}?near (?:"|&quot;|&#0*34;|&#x0*22;)[^"\n&]{0,60}?(?:"|&quot;|&#0*34;|&#x0*22;): syntax error|Unclosed quotation mark after the character string (?!'%\.\*ls')(?:'|&#0*39;|&#x0*27;|&apos;)[\s\S]{0,80}?(?:'|&#0*39;|&#x0*27;|&apos;)\.|Incorrect syntax near (?:'|&#0*39;|&#x0*27;|&apos;)[\s\S]{0,60}?(?:'|&#0*39;|&#x0*27;|&apos;)(?:'|&#0*39;|&#x0*27;|&apos;)|(?:System|Microsoft)\.Data\.SqlClient\.SqlException: Incorrect syntax near (?:'|&#0*39;|&#x0*27;|&apos;)|Microsoft OLE DB Provider for (?:SQL Server|ODBC Drivers) error '[0-9a-f]{8}'|ORA-(?:01756: quoted string not properly terminated|00933: SQL command not properly ended|00911: invalid character|00936: missing expression|00907: missing right parenthesis|00923: FROM keyword not found where expected|01789: query block has incorrect number of result columns)|DPY-2041: missing ending quote|SQLSTATE\[[0-9A-Z]{5}\]: Syntax error or access violation: \d+ |Unknown column (?:'|&#0*39;|&#x0*27;|&apos;)[^'\n&]{0,64}(?:'|&#0*39;|&#x0*27;|&apos;) in (?:'|&#0*39;|&#x0*27;|&apos;)(?:where clause|field list|SELECT|on clause|having clause|order clause|group statement)(?:'|&#0*39;|&#x0*27;|&apos;)|mysqli?_\w+\(\)[^\n]{0,60}(?:expects parameter|supplied (?:argument|resource) is not a valid)
        emit_finding:
          vuln_type: SQL Injection (error-based)
          severity: high

  - name: sqlmap_scan
    tool: sqlmap
    when: no_finding_yet
    command: >-
      bash -c 'S="{{submit}}"; C="{{cookie}}";
      sqlmap -u "{{url}}?{{parameter}}=1${S:+&$S}" -p {{parameter}} ${C:+--cookie "$C"}
      --batch --level 3 --risk 2 --random-agent --technique BEUST
      --timeout 10 --retries 1'
    evaluators:
      - type: regex
        pattern: 'parameter .* is .* vulnerable|appears to be .* injectable'
        emit_finding:
          vuln_type: SQL Injection
          severity: high

  - name: llm_judge
    tool: curl
    when: no_finding_yet
    command: >-
      curl -s -b "{{cookie}}" -H "{{auth_header}}" -o /dev/null -w "noop" "{{url}}"
    evaluators:
      - type: llm
        instruction: >-
          Look at the prior step outputs in this run. sqlmap reported no clear
          injection, but the baseline probe with a single quote may still hint
          at instability. Did sqlmap likely miss a real vulnerability (verdict
          = "missed"), is the endpoint genuinely safe ("safe"), or did a WAF
          interfere ("waf")? Set matched=true only for "missed" or "waf".
        emit_finding:
          vuln_type: SQL Injection (suspected, LLM-flagged)
          severity: medium
        # Was [WSTG-INPV-05-WAF-BYPASS], a case nobody ever wrote — so this
        # edge had never been traversed. When sqlmap reports nothing but the
        # endpoint looks unstable, a verbose database error at the same URL is
        # the corroboration that distinguishes "sqlmap missed it" from "safe".
        chain_to: [WSTG-ERRH-01]

chain:
  on_finding:
    # Blocked, not dead: AUTHZ-04 requires low_priv_token and high_priv_token,
    # which the sweep cannot synthesise, so it is recorded as a NAMED SKIP on
    # every run today. It becomes live when authenticated testing lands. Kept
    # deliberately — an edge that skips out loud is honest; removing it would
    # hide that access-control testing is unreachable for want of credentials.
    - WSTG-AUTHZ-04
