# False-positive cleanroom corpus.
#
# Zone A: deliberate collisions — benign behaviour by a clean app that a
#         detector nonetheless fires on. These emissions ARE the measured
#         false positives, so they are EXPECTED to be non-empty.
# Zone B: ordinary benign traffic. Any finding here is an unambiguous FP.
#
# `expected` is MEASURED, never authored: it is re-derived by running the
# real detectors, and tests/test_cleanroom.py fails on any drift.
# Each fixture carries a COMMAND, because DetectContext parses the URL from
# it — with an empty command 11 of 15 curl rules are structurally dead.

fixtures:
- route: /api/v1/health
  zone: A
  family: ''
  tool: curl
  command: curl -s -i https://api.acme.example.com/api/v1/health
  response: 'HTTP/1.1 200 OK

    Date: Sat, 16 Aug 2026 09:14:02 GMT

    Content-Type: application/json; charset=utf-8

    Strict-Transport-Security: max-age=31536000; includeSubDomains; preload

    X-Content-Type-Options: nosniff

    Cache-Control: no-store

    Content-Length: 96


    {"status":"ok","version":"2.4.1","checks":{"database":"ok","cache":"ok","queue":"ok"}}

    '
  expected:
  - vuln_type: Security Misconfiguration
    severity: medium
    detector: curl:_curl_missing_headers
  rationale: 'A JSON-only API correctly omits CSP and X-Frame-Options: it never returns a document a browser
    renders or frames, so both headers are inert there. The two that do apply (HSTS, nosniff) are set.
    Two ''missing'' headers is exactly the rule''s >=2 threshold, so correct hardening scores identically
    to none. Evidence emitted: ''Missing security headers: Content-Security-Policy, X-Frame-Options''.'
- route: /api/status-intranet
  zone: A
  family: ''
  tool: curl
  command: curl -s -i http://reports.corp.internal:9100/api/status
  response: 'HTTP/1.1 200 OK

    Date: Sat, 16 Aug 2026 09:15:44 GMT

    Content-Type: application/json; charset=utf-8

    X-Frame-Options: DENY

    X-Content-Type-Options: nosniff

    Content-Length: 74


    {"service":"reports","state":"healthy","queue_depth":0,"workers":4}

    '
  expected:
  - vuln_type: Security Misconfiguration
    severity: medium
    detector: curl:_curl_missing_headers
  rationale: Intranet-only service on plain HTTP. Strict-Transport-Security over http:// is ignored by
    browsers per RFC 6797, so omitting it is correct, and CSP is inert on a JSON endpoint. Both omissions
    are deliberate and right; together they cross the threshold. The rule never inspects the scheme, so
    it recommends HSTS on a URL where HSTS cannot work.
- route: /status-page-root
  zone: A
  family: ''
  tool: curl
  command: curl -s -i https://status.acme.example.com/
  response: 'HTTP/1.1 200 OK

    Date: Sat, 16 Aug 2026 09:16:10 GMT

    Server: nginx

    X-Powered-By: Express

    Content-Type: text/html; charset=utf-8

    Content-Security-Policy: default-src ''self''

    X-Frame-Options: DENY

    Strict-Transport-Security: max-age=31536000; includeSubDomains

    X-Content-Type-Options: nosniff


    <!doctype html><title>Acme Status</title>

    <h1>All systems operational</h1>

    <p>Last incident: none in 94 days.</p>

    '
  expected:
  - vuln_type: Information Disclosure
    severity: medium
    detector: curl:_curl_server_header
  rationale: 'A deliberately public, unauthenticated status page. The operator leaves the framework banner
    on because the page holds nothing to protect; no version is disclosed, so there is nothing to pivot
    on. Note the emitted evidence is ''Server header exposes: nginx'' -- the condition tripped on X-Powered-By
    but the regex alternation matched the earlier ''Server:'' line, so the finding names a header value
    that is not the one that triggered it.'
- route: /v1/orders/8842
  zone: A
  family: ''
  tool: curl
  command: curl -s -i https://api.acme.example.com/v1/orders/8842
  response: 'HTTP/1.1 500 Internal Server Error

    Date: Sat, 16 Aug 2026 09:17:31 GMT

    Content-Type: application/json; charset=utf-8

    Content-Security-Policy: default-src ''self''

    X-Frame-Options: DENY

    Strict-Transport-Security: max-age=31536000; includeSubDomains

    X-Content-Type-Options: nosniff


    {"error":{"code":"internal_error","message":"An unexpected error occurred.","request_id":"req_01J8Z4","stacktrace":null}}

    '
  expected:
  - vuln_type: Information Disclosure
    severity: info
    detector: curl:_curl_stack_trace
  rationale: A designed, non-leaking error envelope. The schema always carries a 'stacktrace' key so responses
    have a stable shape; in production it is always null and the real trace goes to the log pipeline.
    The word appears as a FIELD NAME and the field is empty, but _STACKTRACE_MARKERS is a bare substring
    test over the lowercased body, so an explicitly suppressed trace reads as a disclosed one.
- route: /docs/errors
  zone: A
  family: ''
  tool: curl
  command: curl -s -i https://developers.acme.example.com/docs/errors
  response: "HTTP/1.1 200 OK\nDate: Sat, 16 Aug 2026 09:18:02 GMT\nContent-Type: text/html; charset=utf-8\n\
    Content-Security-Policy: default-src 'self'\nX-Frame-Options: DENY\nStrict-Transport-Security: max-age=31536000;\
    \ includeSubDomains\nX-Content-Type-Options: nosniff\n\n<!doctype html><title>Error handling - Acme\
    \ Developers</title>\n<h1>Error handling</h1>\n<p>In <code>development</code> mode only, the API appends\
    \ a trace. Example:</p>\n<pre>TypeError: Cannot read properties of undefined\n    at getOrder (/srv/app/server.js:42:15)</pre>\n\
    <p>Never enable this in production. See the deployment guide.</p>\n"
  expected:
  - vuln_type: Information Disclosure
    severity: info
    detector: curl:_curl_stack_trace
  rationale: Public developer documentation. The stack frame is a fabricated illustration inside a <pre>
    block written by the docs team to show what NOT to ship; the live API never emits it. It satisfies
    two of the three markers at once (the /app/ filesystem substring and the .js:LINE:COL frame regex)
    on a 200 OK page that is not an error at all -- and the emitted evidence still reads 'Server error
    with stack trace'.
- route: /http-to-https-redirect
  zone: A
  family: ''
  tool: curl
  command: curl -s -I http://www.acme.example.com/
  response: 'HTTP/1.1 301 Moved Permanently

    Date: Sat, 16 Aug 2026 09:19:20 GMT

    Location: https://www.acme.example.com/

    Content-Length: 0

    Connection: keep-alive

    '
  expected:
  - vuln_type: Security Misconfiguration
    severity: medium
    detector: curl:_curl_missing_headers
  rationale: 'The canonical, recommended edge behaviour: an empty 301 that upgrades the scheme. It has
    no body, so CSP/XFO/nosniff have nothing to govern, and HSTS must not be sent over plain HTTP. All
    four headers are absent precisely because sending any of them would be wrong -- and this is the maximal-severity
    shape of the finding (all four listed). Every HTTPS-enforcing site on earth produces this fixture.'
- route: /api/v1/shipping/options
  zone: A
  family: ''
  tool: curl
  command: curl -s -i https://shop.acme.example.com/api/v1/shipping/options
  response: 'HTTP/1.1 200 OK

    Date: Sat, 16 Aug 2026 09:20:05 GMT

    Server: nginx

    Content-Type: application/json; charset=utf-8

    Content-Security-Policy: default-src ''self''

    X-Frame-Options: DENY

    Strict-Transport-Security: max-age=31536000; includeSubDomains

    X-Content-Type-Options: nosniff


    {"options":[{"code":"standard","label":"Standard (5-7 days)","price":0},{"code":"express","label":"Express
    (next day)","price":1200}]}

    '
  expected:
  - vuln_type: Information Disclosure
    severity: medium
    detector: curl:_curl_server_header
  rationale: 'A hardened response: bare ''Server: nginx'' with the version suppressed (nothing actually
    disclosed) plus a full security-header set. The only occurrence of ''express'' anywhere is the shipping
    tier in the JSON body. The rule''s second clause ANDs two whole-output substring tests without distinguishing
    headers from body, so any body containing the word ''express'' converts a benign server banner into
    a medium Information Disclosure.'
- route: /pricing
  zone: B
  family: ''
  tool: curl
  command: curl -s -i https://www.acme.example.com/pricing
  response: 'HTTP/1.1 200 OK

    Date: Sat, 16 Aug 2026 09:21:44 GMT

    Content-Type: text/html; charset=utf-8

    Content-Security-Policy: default-src ''self''

    X-Frame-Options: DENY

    Strict-Transport-Security: max-age=31536000; includeSubDomains

    X-Content-Type-Options: nosniff

    Referrer-Policy: strict-origin-when-cross-origin


    <!doctype html><title>Pricing - Acme</title>

    <h1>Plans</h1><ul><li>Starter</li><li>Team</li><li>Enterprise</li></ul>

    '
  expected: []
  rationale: 'Ordinary hardened marketing page with nothing sensitive. The silent baseline: proves the
    three rules in this family are actually reachable-but-quiet rather than dead, so a zero elsewhere
    means something.'
- route: /account/sign-in
  zone: B
  family: ''
  tool: curl
  command: curl -s https://www.acme.example.com/account/sign-in
  response: "<!doctype html>\n<title>Sign in - Acme</title>\n<form method=\"post\" action=\"/account/sign-in\"\
    >\n  <label>Email <input type=\"email\" name=\"email\"></label>\n  <label>Password <input type=\"\
    password\" name=\"password\"></label>\n  <button>Sign in</button>\n</form>\n<script src=\"/static/auth.js\"\
    ></script>\n"
  expected: []
  rationale: 'A body-only fetch of an ordinary login page; no -i/-I/--head was passed, so the operator
    never saw a single response header. It still gets header-audited because the -i gate is a bare substring
    test and the path ''sign-in'' contains ''-i''. Confirmed by control: the identical body at /account/login
    (no ''-i'' substring) yields no header finding. The response also trips _curl_exposed_user_data, whose
    evidence self-refutes: ''API exposes user data: 0 user records found''.'
- route: /api/v1/inventory
  zone: B
  family: ''
  tool: curl
  command: curl -s https://inventory.corp.internal/api/v1/inventory --insecure
  response: '{"items":[{"sku":"ACME-100","qty":42},{"sku":"ACME-220","qty":7}],"page":1}

    '
  expected: []
  rationale: 'Body-only fetch against an internal host with a private-CA certificate, hence --insecure.
    No header flag was used, yet the finding lists all four headers as missing. Cause confirmed by control:
    ''--insecure'' contains the substring ''-i''. The same command with -k instead of --insecure produces
    nothing, so the finding depends on which spelling of the TLS flag the operator typed.'
- route: /spa-shell
  zone: B
  family: ''
  tool: curl
  command: curl -s -i https://app.acme.example.com/
  response: 'HTTP/1.1 200 OK

    Date: Sat, 16 Aug 2026 09:23:11 GMT

    Content-Type: text/html; charset=utf-8

    Content-Security-Policy: default-src ''self''

    X-Frame-Options: DENY

    Strict-Transport-Security: max-age=31536000; includeSubDomains

    X-Content-Type-Options: nosniff


    <!doctype html><html><head><title>Acme</title>

    <link rel="stylesheet" href="/app/styles.4f2a.css">

    </head><body><app-root></app-root>

    <script src="/app/runtime.9c1e.js" defer></script>

    <script src="/app/main.9c1e.js" defer></script>

    </body></html>

    '
  expected: []
  rationale: The index shell of a compiled front-end, fully hardened, no error and no server state. Its
    bundles are served under the /app/ path prefix, which is a framework default. _FILESYSTEM_MARKERS
    matches '/app/' anywhere in the output with no requirement that the status be an error, so a 200 OK
    asset reference is reported as 'Server error with stack trace'. The same fires for any page mentioning
    /usr/, /var/, /home/ or /root/ in ordinary prose or hrefs.
- route: /api/version-hsts-only
  zone: B
  family: ''
  tool: curl
  command: curl -s -i http://reports.corp.internal:9100/api/version
  response: 'HTTP/1.1 200 OK

    Date: Sat, 16 Aug 2026 09:24:02 GMT

    Content-Type: application/json; charset=utf-8

    Content-Security-Policy: default-src ''none''

    X-Frame-Options: DENY

    X-Content-Type-Options: nosniff


    {"version":"2.4.1","commit":"a91f0c2"}

    '
  expected: []
  rationale: 'Same intranet service as the Zone A plain-HTTP fixture but with CSP also set, so only HSTS
    is absent and only because the transport is plain HTTP. Threshold control: proves the >=2 guard genuinely
    suppresses, and that the Zone A sibling fires on count alone rather than on anything about the target.'
- route: /api/public/fx-rates
  zone: A
  family: ''
  tool: curl
  command: 'curl -s -i "https://api.acme-cleanroom.test/api/public/fx-rates" -H "Origin: https://widgets.partner.example"'
  response: "HTTP/1.1 200 OK\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nContent-Type:\
    \ application/json; charset=utf-8\r\nAccess-Control-Allow-Origin: *\r\nCache-Control: public, max-age=300\r\
    \nContent-Length: 118\r\n\r\n{\"base\":\"GBP\",\"published\":\"2026-08-15T09:00:00Z\",\"rates\":{\"\
    EUR\":1.1642,\"USD\":1.2711,\"JPY\":187.44,\"CHF\":1.0903}}\n"
  expected: []
  rationale: 'COLLISION TARGET: bare wildcard ACAO. A genuinely public, unauthenticated rates API. A wildcard
    origin with no Access-Control-Allow-Credentials is the correct way to serve one: browsers refuse to
    attach cookies to a wildcard origin, so a cross-origin read returns only what any anonymous client
    could already fetch. This is the positive control for the recent _curl_cors correction -- MEASURED
    SILENT, so the credentials gate holds.'
- route: /api/v1/me
  zone: A
  family: ''
  tool: curl
  command: 'curl -s -i "https://api.acme-cleanroom.test/api/v1/me" -H "Origin: https://app.acme-cleanroom.test"
    -b "sid=8f2c1ab9"'
  response: "HTTP/1.1 200 OK\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nContent-Type:\
    \ application/json; charset=utf-8\r\nVary: Origin, Cookie\r\nAccess-Control-Allow-Origin: https://app.acme-cleanroom.test\r\
    \nAccess-Control-Allow-Credentials: true\r\nCache-Control: no-store\r\n\r\n{\"id\":\"usr_8812\",\"\
    displayName\":\"Dana Whitfield\",\"locale\":\"en-GB\",\"timeZone\":\"Europe/London\"}\n"
  expected:
  - vuln_type: CORS Misconfiguration
    severity: high
    detector: curl:_curl_cors
  rationale: 'COLLISION TARGET: allowlist echo read as reflection. Access-Control-Allow-Origin cannot
    hold a list, so a server that allows exactly one first-party origin MUST echo that origin back and
    set Vary: Origin -- this is the spec-mandated correct implementation, and app.acme-cleanroom.test
    is the same operator''s own SPA. _curl_cors computes `reflected` as `echoed origin == origin we sent`
    and cannot distinguish a one-entry allowlist from an echo-anything policy, so the single most common
    correct credentialed-CORS deployment scores HIGH. This is the largest false positive in the family.'
- route: /redirect?url=/dashboard [absolute Location]
  zone: A
  family: ''
  tool: curl
  command: curl -s -i "https://portal.acme-cleanroom.test/redirect?url=/dashboard"
  response: "HTTP/1.1 302 Found\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nLocation:\
    \ https://portal.acme-cleanroom.test/dashboard\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length:\
    \ 0\r\n\r\n"
  expected:
  - vuln_type: Open Redirect
    severity: medium
    detector: curl:_curl_open_redirect
  rationale: 'COLLISION TARGET: the hardcoded ''juice'' guard. A legitimate post-login bounce endpoint
    that validates its url parameter against an allowlist of in-app paths and redirects SAME-ORIGIN. RFC
    7231 historically required an absolute URI in Location and many frameworks (plus any reverse proxy
    that rewrites it) still emit one. The only anti-FP guard in _curl_open_redirect is `''juice'' not
    in location`, so on any non-Juice-Shop target this correct redirect fires. Known live defect; recorded
    honestly. Note the emitted parameter is the hardcoded "to" while the real parameter is "url".'
- route: /redirect?url=/dashboard [relative Location]
  zone: A
  family: ''
  tool: curl
  command: curl -s -i "https://portal.acme-cleanroom.test/redirect?url=/dashboard"
  response: "HTTP/1.1 302 Found\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nLocation:\
    \ /dashboard\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: 0\r\n\r\n"
  expected: []
  rationale: 'PAIRED CONTROL for the fixture above: byte-for-byte the same safe behaviour, expressed as
    a relative Location. MEASURED SILENT. The pair proves the detector is keying on Location *syntax*
    (does the value contain the substring ''http'') rather than on cross-origin-ness -- the same clean
    endpoint is a medium finding or a non-finding depending on whether the framework emits an absolute
    or relative Location.'
- route: /download?name=report%00.pdf [rejected, -i]
  zone: A
  family: ''
  tool: curl
  command: curl -s -i "https://files.acme-cleanroom.test/download?name=report%00.pdf"
  response: "HTTP/1.1 400 Bad Request\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nContent-Type:\
    \ application/json; charset=utf-8\r\nContent-Length: 121\r\n\r\n{\"error\":\"invalid_path\",\"message\"\
    :\"The name parameter contains an illegal character sequence and was rejected.\"}\n"
  expected:
  - vuln_type: Sensitive Data Exposure
    severity: high
    detector: curl:_curl_null_byte
  rationale: 'COLLISION TARGET: the output[:100] ''error'' guard. The clean app CORRECTLY rejects the
    null-byte traversal with 400 and serves no file at all. _curl_null_byte''s only anti-FP guard is `''error''
    not in output_lower[:100]`, and under -i the first 100 bytes are always the status line and Date/Server
    headers, so the guard never sees the body. Emitted evidence reads "Null byte bypass successful --
    restricted file accessible (476 bytes returned)": the 476 bytes are the refusal itself.'
- route: /download?name=report%00.pdf [rejected, body only]
  zone: A
  family: ''
  tool: curl
  command: curl -s "https://files.acme-cleanroom.test/download?name=report%00.pdf"
  response: '{"error":"invalid_path","message":"The name parameter contains an illegal character sequence
    and was rejected."}

    '
  expected: []
  rationale: 'PAIRED CONTROL: identical rejection, identical clean behaviour, fetched without -i so the
    body starts at byte 0 and the ''error'' token lands inside the 100-byte window. MEASURED SILENT. The
    pair isolates the cause precisely -- the same clean 400 is HIGH or nothing depending only on whether
    headers were requested.'
- route: /api/feedbacks [authenticated POST]
  zone: A
  family: ''
  tool: curl
  command: 'curl -s -i -X POST "https://portal.acme-cleanroom.test/api/feedbacks" -H "Content-Type: application/json"
    -b "sid=8f2c1ab9" -d ''{"comment":"Checkout was quick","rating":5,"UserId":9999}'''
  response: "HTTP/1.1 201 Created\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nContent-Type:\
    \ application/json; charset=utf-8\r\nLocation: /api/feedbacks/70314\r\n\r\n{\"data\":{\"id\":70314,\"\
    comment\":\"Checkout was quick\",\"rating\":5,\"UserId\":4412,\"createdAt\":\"2026-08-15T09:14:03Z\"\
    }}\n"
  expected:
  - vuln_type: Broken Access Control
    severity: high
    detector: curl:_curl_forged_feedback
  rationale: 'COLLISION TARGET: presence of the string "userid" in a response body. The request supplies
    UserId 9999 and the server IGNORES it, stamping the session owner 4412 instead -- this response is
    the *proof the app is not vulnerable*. Echoing the stored row back in a 201 is ordinary REST. _curl_forged_feedback
    tests only url contains /api/feedbacks AND body contains "userid" AND command contains "POST"; it
    never compares the submitted UserId with the returned one, so correct server-side ownership enforcement
    scores HIGH.'
- route: /api/feedbacks?sort=postedAt
  zone: A
  family: ''
  tool: curl
  command: curl -s -i "https://portal.acme-cleanroom.test/api/feedbacks?sort=postedAt&limit=2" -b "sid=8f2c1ab9"
  response: "HTTP/1.1 200 OK\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nContent-Type:\
    \ application/json; charset=utf-8\r\n\r\n{\"data\":[{\"id\":70314,\"userId\":4412,\"rating\":5,\"\
    postedAt\":\"2026-08-15T09:14:03Z\"},{\"id\":70201,\"userId\":4412,\"rating\":4,\"postedAt\":\"2026-08-14T18:02:55Z\"\
    }]}\n"
  expected:
  - vuln_type: Broken Access Control
    severity: high
    detector: curl:_curl_forged_feedback
  rationale: 'COLLISION TARGET: `"POST" in ctx.command.upper()` is a bare substring test over the whole
    command line. This is a read-only GET of the caller''s OWN feedback list -- no write, no forgery,
    no cross-user data -- but the ordinary query parameter sort=postedAt uppercases to POSTEDAT and satisfies
    the method check. Verified by control probe: the same GET with `?limit=2` alone is silent, so the
    sort parameter is the sole cause.'
- route: /
  zone: B
  family: ''
  tool: curl
  command: curl -s -i "https://portal.acme-cleanroom.test/"
  response: "HTTP/1.1 200 OK\r\nDate: Sat, 15 Aug 2026 09:14:02 GMT\r\nServer: nginx\r\nContent-Security-Policy:\
    \ default-src 'self'\r\nX-Frame-Options: DENY\r\nStrict-Transport-Security: max-age=63072000; includeSubDomains\r\
    \nX-Content-Type-Options: nosniff\r\nReferrer-Policy: strict-origin-when-cross-origin\r\nContent-Type:\
    \ text/html; charset=utf-8\r\nContent-Length: 214\r\n\r\n<!doctype html><html lang=\"en\"><head><title>Acme\
    \ Portal</title></head><body><main><h1>Acme Portal</h1><p>Sign in to continue.</p><a href=\"/session/new\"\
    >Sign in</a></main></body></html>\n"
  expected: []
  rationale: 'Ordinary homepage fetch from a fully hardened clean app: all four security headers present,
    no X-Powered-By, nginx rather than Express, no CORS headers. MEASURED SILENT. This is the corpus''s
    baseline negative control -- it proves the whole curl rule chain is reachable-but-quiet, so a silent
    Zone B is a real result rather than a dead harness.'
- route: /assets/inter-var.woff2
  zone: B
  family: ''
  tool: curl
